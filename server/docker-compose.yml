services:
  quoteview-server:
    # Reuses an image already on this host — the server is stdlib-only python,
    # so any image with python3 works and nothing needs to be pulled or built.
    image: mine/claude:latest
    container_name: quoteview-server
    restart: unless-stopped

    # Host networking on purpose: nginx (itself host-network) proxies
    # /quoteview/api/ to this loopback port. The server binds 127.0.0.1 only,
    # so nothing is reachable from outside except through nginx.
    network_mode: host

    # All tunables live in cfg/, per this host's cfg/data/log/scripts layout.
    env_file:
      - ./cfg/server.env

    # The image's own entrypoint is a Claude Code launcher; this container only
    # wants its python3.
    entrypoint: ["python3", "/scripts/server.py"]

    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data
      - ./log:/log

    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
